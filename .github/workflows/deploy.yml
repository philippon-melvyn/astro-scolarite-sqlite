name: Deploy AstroJS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on Ubuntu server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            echo "======================================"
            echo "Début du déploiement"
            echo "======================================"

            cd /var/www/scolarite/astro-scolarite-sqlite

            echo "Mise à jour du code..."
            git pull origin

            echo "Installation des dépendances..."
            /home/etudiant/.bun/bin/bun ci

            echo "Compilation Astro..."
            /home/etudiant/.bun/bin/bun run --bun build

            echo "Redémarrage de l'application..."
            sudo systemctl restart scolarite

            echo "Vérification du service..."
            sudo systemctl status scolarite

            echo "Health check..."
            curl --fail --insecure --retry 10 --retry-connrefused --retry-delay 2 --max-time 5 https://localhost:3000/

            echo "======================================"
            echo "Déploiement terminé"
            echo "======================================"